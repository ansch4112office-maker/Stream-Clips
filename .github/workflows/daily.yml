name: Taeglich

# Jeden Tag: neueste VODs aller Streamer aus streamers.txt suchen, auto_clips.yml dafuer starten,
# warten, die besten Clips auswaehlen, davon die Endfassung mit besten Untertiteln bauen
# (Whisper large-v3-turbo, nur fuer die Gewinner) und auf YouTube hochladen.
# Cron laeuft in UTC: 02:00 UTC = 03:00 Uhr deutscher Winterzeit (im Sommer 04:00 Uhr).

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write   # data/processed_vods.txt ins Repo schreiben
  actions: write    # auto_clips.yml starten und Artefakte lesen

concurrency:
  group: taeglich
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FINAL_WHISPER_MODEL: ${{ vars.FINAL_WHISPER_MODEL || 'large-v3-turbo' }}
      FINAL_WHISPER_LANG: ${{ vars.FINAL_WHISPER_LANG || 'de' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tools installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install yt-dlp google-api-python-client google-auth numpy
          pip install --upgrade faster-whisper

      # Das grosse Modell wird gemerkt, damit es nicht jeden Tag neu heruntergeladen wird.
      - name: Gemerktes Whisper-Modell laden
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.FINAL_WHISPER_MODEL }}-v1

      # Einmal vorladen, solange sowieso gewartet wird. Klappt das nicht, versucht finalize.py es spaeter nochmal.
      - name: Whisper-Modell vorladen
        continue-on-error: true
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('${{ env.FINAL_WHISPER_MODEL }}', device='cpu', compute_type='int8')"

      - name: Neue VODs suchen und Clip-Laeufe starten
        run: python scripts/daily_start.py

      - name: Verarbeitete VODs merken
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/processed_vods.txt
          git diff --cached --quiet || { git commit -m "Verarbeitete VODs aktualisiert" && git push; }

      - name: Auf die Clip-Laeufe warten und Clips laden
        env:
          MAX_WAIT_MIN: "320"  # 360 Minuten Gesamtlimit minus Platz fuer Endfassung und Upload
        run: |
          if [ "$(jq length runs.json)" = "0" ]; then
            echo "Keine neuen VODs heute." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/daily_collect.py

      - name: Beste Clips auswaehlen, Endfassung bauen und hochladen
        run: |
          if [ ! -d clips ]; then echo "Keine Clips."; exit 0; fi
          python scripts/daily_publish.py
