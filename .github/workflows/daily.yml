name: Taeglich

# Jeden Tag: neueste VODs aller Streamer aus streamers.txt suchen, auto_clips.yml dafuer starten,
# warten, die besten Clips auswaehlen und auf YouTube hochladen.
# Cron laeuft in UTC: 02:00 UTC = 03:00 Uhr deutscher Winterzeit (im Sommer 04:00 Uhr).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # data/processed_vods.txt ins Repo schreiben
  actions: write    # auto_clips.yml starten und Artefakte lesen

concurrency:
  group: taeglich
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tools installieren
        run: pip install yt-dlp google-api-python-client google-auth

      - name: Neue VODs suchen und Clip-Laeufe starten
        run: python scripts/daily_start.py

      - name: Verarbeitete VODs merken
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/processed_vods.txt
          git diff --cached --quiet || { git commit -m "Verarbeitete VODs aktualisiert" && git push; }

      - name: Auf die Clip-Laeufe warten und Clips laden
        env:
          MAX_WAIT_MIN: "330"
        run: |
          if [ "$(jq length runs.json)" = "0" ]; then
            echo "Keine neuen VODs heute." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/daily_collect.py

      - name: Beste Clips auswaehlen und hochladen
        env:
          PRIVACY: private
        run: |
          if [ ! -d clips ]; then echo "Keine Clips."; exit 0; fi
          python scripts/daily_publish.py
