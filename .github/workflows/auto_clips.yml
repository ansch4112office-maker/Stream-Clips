name: Auto-Clips
run-name: Auto-Clips ${{ github.event.inputs.streamer }}



# Ein Klick: VOD rein, Kandidaten raus.
# Ablauf: Transkript (Whisper tiny, nur zur Orientierung) + laute Stellen -> Chat-Replay und
# Zuschauer-Clips (Chat-Spitzen) -> Gemini waehlt Kandidaten aus den staerksten Zonen ->
# Facecam wird einmal pro Streamer gefunden und gemerkt ->
# jeder Kandidat wird geschnitten, von Gemini als Video geprueft (behalten oder aussortieren,
# Titel und Laenge korrigieren, langweiligen Anfang kuerzen) und bekommt das Layout oben Facecam /
# unten Gameplay, noch OHNE Untertitel -> alles in einem Download.
# Die Untertitel (Whisper large-v3-turbo) entstehen erst in daily.yml, nur fuer die Gewinner.
# Gibt es keine guten Clips, steht das in der Zusammenfassung des Laufs.

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: "Link zum VOD"
        required: true
      streamer:
        description: "Name des Streamers (muss in streamers.txt stehen)"
        required: true
      start:
        description: "Optional: Start im VOD, HH:MM:SS (Standard: Anfang)"
        required: false
        default: "00:00:00"
      end:
        description: "Optional: Ende im VOD, HH:MM:SS (Standard: bis zum Ende)"
        required: false
        default: "inf"
      facecam_neu:
        description: "Facecam neu erkennen (sonst wird die gemerkte Position des Streamers benutzt)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Transkript, Chat und Clip-Auswahl
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      clips: ${{ steps.pick.outputs.clips }}
    env:
      VOD_URL: ${{ github.event.inputs.vod_url }}
      STREAMER: ${{ github.event.inputs.streamer }}
      START: ${{ github.event.inputs.start }}
      END: ${{ github.event.inputs.end }}
    steps:
      - uses: actions/checkout@v4

      - name: Streamer pruefen
        run: |
          name=$(echo "$STREAMER" | tr '[:upper:]' '[:lower:]')
          if ! grep -qix "$name" streamers.txt; then
            echo "Streamer '$name' steht nicht in streamers.txt. Abbruch."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tools installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp faster-whisper numpy

      - name: Audio laden
        run: |
          # --force-keyframes-at-cuts: der Ausschnitt beginnt genau bei START und nicht ein paar
          # Sekunden frueher, sonst stimmen Transkript-Zeiten und VOD-Zeiten nicht ueberein
          yt-dlp --download-sections "*$START-$END" --force-keyframes-at-cuts -x --audio-format wav --postprocessor-args "ffmpeg:-ac 1 -ar 16000" -o "audio.%(ext)s" "$VOD_URL"
          ls -lh audio.wav

      - name: Transkribieren (schnell) und laute Momente finden
        env:
          PYTHONUNBUFFERED: "1"
          # tiny reicht zur Orientierung und zum Einrasten der Zeiten. Die Untertitel kommen spaeter
          # aus einem eigenen Durchlauf mit dem besten Modell. Wenn zu oft "Anfang nicht im Transkript
          # gefunden" im Log steht, hier auf base hochstellen.
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'tiny' }}
          WHISPER_LANG: ${{ vars.WHISPER_LANG || '' }}
        run: |
          mkdir -p data

          # Waechter im Hintergrund: schreibt alle 20 s RAM, Last und freien Platz ins Log.
          # Bricht der Runner ab, sieht man hier, wie es ihm kurz davor ging.
          monitor() {
            while true; do
              echo "[monitor] $(date +%T) RAM $(free -m | awk '/Mem:/ {print $3 "/" $2 " MB"}'), Last $(cut -d' ' -f1 /proc/loadavg), Platte frei $(df -h . | awk 'NR==2 {print $4}')"
              sleep 20
            done
          }
          monitor &
          MONITOR_PID=$!
          trap 'kill $MONITOR_PID 2>/dev/null || true' EXIT
          echo "Kerne: $(nproc)"
          free -m

          python scripts/analyze.py audio.wav data/latest.json
          IFS=: read -r h m s <<< "$START"
          export OFFSET=$((10#$h*3600 + 10#$m*60 + 10#$s))
          python - <<'EOF'
          import json, os
          off = int(os.environ["OFFSET"])
          with open("data/latest.json", encoding="utf-8") as f:
              d = json.load(f)
          for x in d["transcript"] + d["words"] + d["loud_moments"]:
              x["start"] += off
              x["end"] += off
          d["offset_sec"] = off
          with open("data/latest.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, separators=(",", ":"))
          EOF

      - name: Diagnose (nur bei Fehler oder Abbruch)
        if: failure() || cancelled()
        run: |
          free -m
          df -h .
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -n 10 || true

      # Optional: Klappt das nicht (Chat gesperrt, VOD ohne Chat, Download-Fehler), laeuft alles wie
      # vorher nur mit Lautstaerke und Transkript weiter. Zuschauer-Clips gibt es nur, wenn die
      # Secrets TWITCH_CLIENT_ID und TWITCH_CLIENT_SECRET gesetzt sind.
      - name: Chat laden und Chat-Spitzen berechnen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python scripts/fetch_chat.py "$VOD_URL" "$START" "$END" chat.json twitch_clips.json
          if [ -s chat.json ] || [ -s twitch_clips.json ]; then
            python scripts/chat_peaks.py data/latest.json chat.json twitch_clips.json
          else
            echo "Kein Chat und keine Zuschauer-Clips, es zaehlen nur Lautstaerke und Transkript."
          fi

      - name: Kandidaten mit Gemini aussuchen
        id: pick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scripts/pick_clips.py data/latest.json clips.json
          echo "clips=$(jq -c '[.clips[] | {name, title, kind, start_sec, end_sec, seg_start, seg_end, seg_start_sec}]' clips.json)" >> "$GITHUB_OUTPUT"

      - name: Auswahl und Transkript aufheben (zum Nachschauen und fuer die naechsten Jobs)
        uses: actions/upload-artifact@v4
        with:
          name: auswahl
          path: |
            clips.json
            data/latest.json
          retention-days: 7

  facecam:
    name: Facecam finden
    needs: analyze
    if: ${{ needs.analyze.outputs.clips != '' && needs.analyze.outputs.clips != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOD_URL: ${{ github.event.inputs.vod_url }}
      STREAMER: ${{ github.event.inputs.streamer }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Streamer-Kennung
        run: echo "SLUG=$(echo "$STREAMER" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_')" >> "$GITHUB_ENV"

      # Die Position der Facecam bleibt pro Streamer meist gleich. Sie wird deshalb einmal erkannt
      # und im Cache gemerkt. Mit "facecam_neu" wird der Cache ignoriert.
      - name: Gemerkte Facecam laden
        if: ${{ github.event.inputs.facecam_neu != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: facecam_cache
          key: facecam-${{ env.SLUG }}-${{ github.run_id }}
          restore-keys: |
            facecam-${{ env.SLUG }}-

      - name: Gemerkte Facecam pruefen
        id: have
        run: |
          mkdir -p facecam_cache out
          if [ -s facecam_cache/facecam.json ]; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "Gemerkte Facecam gefunden:"; cat facecam_cache/facecam.json; echo
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools installieren
        if: steps.have.outputs.cached == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp numpy "opencv-python-headless<5"

      - uses: actions/download-artifact@v4
        if: steps.have.outputs.cached == 'false'
        with:
          name: auswahl
          path: auswahl

      - name: Facecam erkennen
        id: detect
        if: steps.have.outputs.cached == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          # bis zu vier kurze Ausschnitte (je 4 s) aus verschiedenen Kandidaten laden
          n=$(jq '.clips | length' auswahl/clips.json)
          [ "$n" -gt 4 ] && n=4
          for i in $(seq 0 $((n - 1))); do
            s=$(jq -r ".clips[$i].start_sec" auswahl/clips.json)
            a=$(printf '%02d:%02d:%02d' $(((s + 3) / 3600)) $(((s + 3) % 3600 / 60)) $(((s + 3) % 60)))
            b=$(printf '%02d:%02d:%02d' $(((s + 7) / 3600)) $(((s + 7) % 3600 / 60)) $(((s + 7) % 60)))
            yt-dlp --download-sections "*$a-$b" --force-keyframes-at-cuts \
              -f "best[height<=1080]/best" -o "snip_$i.mp4" "$VOD_URL" || echo "Ausschnitt $i nicht geladen"
          done
          ls -lh snip_*.mp4 || true
          python scripts/detect_facecam.py facecam_new.json debug_facecam.jpg snip_*.mp4
          if [ "$(jq -r .found facecam_new.json)" = "true" ]; then
            cp facecam_new.json facecam_cache/facecam.json
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Facecam merken (nur wenn sicher erkannt)
        if: steps.detect.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: facecam_cache
          key: facecam-${{ env.SLUG }}-${{ github.run_id }}

      - name: Ergebnis fuer die Clip-Jobs bereitstellen
        run: |
          if [ -s facecam_cache/facecam.json ]; then
            cp facecam_cache/facecam.json out/facecam.json
          elif [ -s facecam_new.json ]; then
            cp facecam_new.json out/facecam.json
          else
            echo '{"found": false, "reason": "Erkennung nicht gelaufen"}' > out/facecam.json
          fi
          cp debug_facecam.jpg out/ 2>/dev/null || true
          {
            echo "**Facecam ($SLUG)**"
            echo '```'
            cat out/facecam.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: facecam
          path: out/
          retention-days: 7

  cut:
    name: Clip ${{ matrix.clip.name }}
    needs: [analyze, facecam]
    if: ${{ !cancelled() && needs.analyze.result == 'success' && needs.analyze.outputs.clips != '' && needs.analyze.outputs.clips != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        clip: ${{ fromJson(needs.analyze.outputs.clips) }}
    env:
      VOD_URL: ${{ github.event.inputs.vod_url }}
      CLIP_NAME: ${{ matrix.clip.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tools installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - uses: actions/download-artifact@v4
        with:
          name: auswahl
          path: auswahl

      - uses: actions/download-artifact@v4
        continue-on-error: true  # ohne Facecam-Ergebnis wird das normale 9:16-Layout gebaut
        with:
          name: facecam
          path: face

      - name: Ausschnitt laden (Kandidat mit Puffer)
        run: |
          yt-dlp --download-sections "*${{ matrix.clip.seg_start }}-${{ matrix.clip.seg_end }}" --force-keyframes-at-cuts \
            -f "best[height<=1080]/best" -o raw.mp4 "$VOD_URL"

      - name: Von Gemini pruefen lassen und schneiden
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SEG_START_SEC: ${{ matrix.clip.seg_start_sec }}
          CLIP_START_SEC: ${{ matrix.clip.start_sec }}
          CLIP_END_SEC: ${{ matrix.clip.end_sec }}
          CLIP_TITLE: ${{ matrix.clip.title }}
          CLIP_KIND: ${{ matrix.clip.kind }}
        run: |
          python scripts/review_clips.py raw.mp4 auswahl/data/latest.json review.json trimmed.mp4
          echo "keep=$(jq -r .keep review.json)" >> "$GITHUB_OUTPUT"
          jq -r --arg n "$CLIP_NAME" '"**" + $n + "** (" + .title + "): " + (if .keep then "behalten, " + (.laenge|tostring) + " s" else "aussortiert" end) + " | Score " + (.score|tostring) + (if .start_langweilig then " | Anfang gekuerzt um " + (.start_verschoben|tostring) + " s" else "" end) + (if .geprueft then "" else " | NICHT geprueft, Gemini nicht erreichbar" end) + " | " + .reason + "\n"' review.json >> "$GITHUB_STEP_SUMMARY"

      # Hier noch ohne Untertitel: Die bekommen nur die Gewinner in daily.yml, mit dem besten
      # Whisper-Modell. Dafuer wandert der geschnittene 16:9-Clip (_src) mit ins Artefakt.
      - name: Layout bauen (oben Facecam, unten Gameplay) und Quelle fuer die Endfassung ablegen
        if: steps.review.outputs.keep == 'true'
        run: |
          mkdir -p fertig
          python scripts/to_split.py trimmed.mp4 "fertig/$CLIP_NAME.mp4" face/facecam.json
          jq -r .title review.json > "fertig/$CLIP_NAME.txt"
          cp review.json "fertig/$CLIP_NAME.json"
          cp trimmed.mp4 "fertig/${CLIP_NAME}_src.mp4"
          if [ -s face/facecam.json ]; then
            cp face/facecam.json "fertig/${CLIP_NAME}_facecam.json"
          else
            echo '{"found": false, "reason": "keine Facecam-Datei"}' > "fertig/${CLIP_NAME}_facecam.json"
          fi

      - name: Fertigen Clip hochladen
        if: steps.review.outputs.keep == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.clip.name }}
          path: fertig/
          retention-days: 7

  sammeln:
    name: Alle Clips in einen Download
    needs: [analyze, cut]
    if: ${{ !cancelled() && needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fertige Clips zaehlen
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[].name' | grep -c '^clip-' || true)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Fertige Clips: $n"

      - name: Meldung wenn nichts uebrig ist
        if: steps.count.outputs.n == '0'
        run: |
          {
            echo "## Keine guten Clips gefunden"
            echo
            echo "Gemini hat in diesem VOD-Ausschnitt nichts gefunden, das stark genug ist, oder die zweite Runde hat alle Kandidaten aussortiert. Es gibt deshalb keinen Download. Die Begruendungen stehen bei den einzelnen Clip-Jobs, die Kandidatenliste im Artefakt \"auswahl\"."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alle Clips zusammenfassen
        if: steps.count.outputs.n != '0'
        uses: actions/upload-artifact/merge@v4
        with:
          name: fertige-clips
          pattern: clip-*
          delete-merged: true
          retention-days: 7
